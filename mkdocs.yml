site_name: Johnson Technical Systems
site_description: Fixed-price written security documentation for small firms, including security questionnaires, starter policy packs, AI use policies, public security pages and FTC Safeguards Rule WISP packs, plus partner overflow work, technical documentation and automation.
site_author: Lloyd Johnson
site_url: https://johnsontechnicalsystems.com/
copyright: johnsontechnicalsystems LLC · Documentation and preparation services, not legal advice or an audit opinion · <a href="/legal/terms/">Terms</a> · <a href="/legal/privacy/">Privacy</a> · Samples licensed CC BY-NC-ND 4.0

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Services:
      - Security questionnaires: questionnaires.md
      - Partner overflow work: partners.md
      - AI use policy: ai-policy.md
      - WISP packs (FTC Safeguards Rule): wisp.md
      - Cyber insurance renewal packs: insurance-pack.md
      - Automation for vet clinics: automation.md
  - Samples:
      - Overview: samples.md
      - Sample security questionnaire: sample-questionnaire.md
      - Sample access control policy: sample-access-control-policy.md
      - Sample AI use policy: sample-ai-use-policy.md
      - Sample public security page: sample-security-page.md
      - Sample WISP: sample-wisp.md
      - Sample cyber insurance renewal pack: sample-insurance-renewal-pack.md
      - SOP-001 Secure Remote Access: sops/sop-001-secure-remote-access.md
      - SOP-002 Local LLM Inference Stack: sops/sop-002-local-llm-inference-stack.md
      - SOP-003 Network Troubleshooting Runbook: sops/sop-003-network-troubleshooting-runbook.md
      - SOP-004 Cat6 Termination and Testing: sops/sop-004-cat6-termination-and-testing.md
      - SOP-005 VLAN Creation and Segmentation: sops/sop-005-vlan-creation-and-segmentation.md
      - SOP-006 Endpoint Isolation: sops/sop-006-endpoint-isolation.md
  - About:
      - Security: security.md
      - Review process: about/review-process.md
      - Terms: legal/terms.md
      - Privacy: legal/privacy.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
